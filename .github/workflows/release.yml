name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build assets
        run: |
          mkdir dist
          sed "s/^QM_VERSION=dev$/QM_VERSION=$GITHUB_REF_NAME/" quartermaster > dist/quartermaster
          grep -qx "QM_VERSION=$GITHUB_REF_NAME" dist/quartermaster
          cp install.sh dist/install.sh
          chmod +x dist/quartermaster dist/install.sh
          cd dist && sha256sum quartermaster install.sh > sha256sums

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*
